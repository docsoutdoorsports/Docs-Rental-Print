<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doc's Outdoor Sports - Rental Information</title>

<style>
@page {
    size: letter landscape;
    margin: 0;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #eeeeee;
    color: #111;
}

.sheet {
    width: 11in;
    height: 8.5in;
    margin: 20px auto;
    background: white;
}

.rental-info {
    width: 5.5in;
    height: 8.5in;
    padding: 0.55in 0.45in;
}

h1 {
    margin: 0;
    text-align: center;
    font-size: 24pt;
}

h2 {
    margin: 6px 0 30px;
    text-align: center;
    font-size: 15pt;
    font-weight: normal;
}

.row {
    display: grid;
    grid-template-columns: 1.55in 1fr;
    gap: 0.12in;
    margin-bottom: 0.22in;
    font-size: 14pt;
}

.label {
    font-weight: bold;
}

.value {
    min-height: 0.28in;
    border-bottom: 1px solid #777;
}

.total {
    margin-top: 0.4in;
    padding-top: 0.2in;
    border-top: 2px solid #111;
    font-size: 16pt;
}

.print-button {
    position: fixed;
    top: 15px;
    right: 15px;
    padding: 12px 20px;
    font-size: 16px;
    cursor: pointer;
}

@media print {
    body {
        background: white;
    }

    .sheet {
        margin: 0;
    }

    .print-button {
        display: none;
    }
}
</style>
</head>

<body>

<button class="print-button" onclick="window.print()">Print Rental</button>

<div class="sheet">

    <div class="rental-info">

        <h1>Doc's Outdoor Sports</h1>
        <h2>Rental Information</h2>

        <div class="row">
            <div class="label">Rental #:</div>
            <div class="value" id="rental"></div>
        </div>

        <div class="row">
            <div class="label">Customer:</div>
            <div class="value" id="customer"></div>
        </div>

        <div class="row">
            <div class="label">Phone:</div>
            <div class="value" id="phone"></div>
        </div>

        <div class="row">
            <div class="label">Rental Days:</div>
            <div class="value" id="days"></div>
        </div>

        <div class="row">
            <div class="label">Rental Type:</div>
            <div class="value" id="type"></div>
        </div>

        <div class="row">
            <div class="label">Helmet:</div>
            <div class="value" id="helmet"></div>
        </div>

        <div class="row total">
            <div class="label">Total:</div>
            <div class="value" id="total"></div>
        </div>

    </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);

document.getElementById("rental").textContent =
    params.get("rental") || "";

document.getElementById("customer").textContent =
    params.get("customer") || "";

document.getElementById("phone").textContent =
    params.get("phone") || "";

document.getElementById("days").textContent =
    params.get("days") || "";

document.getElementById("type").textContent =
    params.get("type") || "";

document.getElementById("helmet").textContent =
    params.get("helmet") || "";

document.getElementById("total").textContent =
    params.get("total") || "";
</script>

</body>
</html>
